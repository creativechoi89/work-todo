<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 할 일 · 제어 테스트</title>
<link rel="stylesheet" href="style.css">
<script defer src="core.js"></script><script defer src="app.js"></script>
</head>
<body><main>
<header><span class="badge">LOCAL DEMO</span><h1>나의 할 일</h1><p>작은 계획을 적고, 하나씩 완료해 보세요.</p></header>
<form id="add-form"><label for="task">새 할 일</label><div class="entry"><input id="task" maxlength="120" placeholder="예: 제어 테스트 프로그램 실행하기" autocomplete="off" required><button>추가</button></div></form>
<p id="status" role="status" aria-live="polite"></p>
<section aria-label="할 일 목록"><p id="summary"></p><ul id="tasks"></ul><p id="empty">아직 할 일이 없습니다. 첫 할 일을 추가해 보세요.</p></section>
<footer>이 브라우저에 자동 저장됩니다. 브라우저 데이터 삭제 시 기록도 삭제됩니다.</footer>
</main></body></html>
